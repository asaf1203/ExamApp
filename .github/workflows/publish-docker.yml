name: Publish Docker Images

# Build client/server images and push them to Docker Hub once a day.
# Also allow manual runs from the Actions tab.
on:
  schedule:
    # Every day at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-images:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # Store these in the repo: Settings → Secrets and variables → Actions
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        run: |
          DATE_TAG="$(date -u +%Y%m%d)"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-app-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-app-server:${{ steps.meta.outputs.date_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-app-server:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: client/Dockerfile
          push: true
          build-args: |
            VITE_API_BACKEND=http
            VITE_API_BASE_URL=/api
            VITE_AUTH_API_URL=/api/auth
            VITE_APP_ENV=production
            VITE_MOCK_AUTH_ENABLED=false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-app-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-app-client:${{ steps.meta.outputs.date_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/exam-app-client:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
