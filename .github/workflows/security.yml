name: CI Checks

# Run CI checks for changes pushed to shared branches and for every PR.
on:
  push:
    branches: [main, master, dev]
  pull_request:

# Jobs only need permission to read repository contents.
permissions:
  contents: read

jobs:
  # Scan the complete Git history for accidentally committed credentials.
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks needs the complete history, not GitHub's default shallow clone.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Used by the action to report findings on GitHub.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Project-specific allowlist and scanning configuration.
          GITLEAKS_CONFIG: .gitleaks.toml

  # Verify that protected API endpoints enforce authentication and user roles.
  api-authorization:
    name: API authorization checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Match the Node.js version used by the server Docker image.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # Reproducible install based on package-lock.json.
        run: npm ci

      - name: Run authorization tests
        run: npm run test:auth
        env:
          # Use the in-memory store so CI does not require a PostgreSQL service.
          API_STORE: memory
          # Only the API is needed for these tests.
          SERVE_CLIENT: "0"

  # Build the full stack with Docker Compose and verify the deployment works.
  docker-deploy:
    name: Docker Compose deploy smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start Compose stack
        # Builds client + server images and starts db, server, and client together.
        run: docker compose up --build -d --wait

      - name: Show Compose status
        if: always()
        run: docker compose ps

      - name: Smoke-test the deployment
        # Checks health endpoints, client HTML, proxied login, and auth-protected APIs.
        run: |
          chmod +x scripts/smoke-deploy.sh
          ./scripts/smoke-deploy.sh
        env:
          CLIENT_BASE_URL: http://localhost:8080
          SERVER_BASE_URL: http://localhost:3000

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
